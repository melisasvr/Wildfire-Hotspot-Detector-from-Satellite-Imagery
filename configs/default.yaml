# Wildfire Hotspot Detector: default configuration.
# Everything the pipeline needs lives here. Override with --config or CLI flags.

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  patches: data/processed/patches
  runs: runs
  reports: reports
  demo_assets: demo_assets

region:
  name: northern_california
  bbox: [-123.5, 38.8, -120.5, 41.8]     # west, south, east, north (EPSG:4326)
  analysis_crs: "EPSG:3310"               # California Albers, metres; used for distances and blocks

period:
  # 2024 fire season includes the Park Fire (July 2024). Switch to 2025 if you prefer.
  start_date: "2024-06-01"
  end_date: "2024-10-31"

firms:
  sources: ["VIIRS_SNPP_SP", "VIIRS_NOAA20_SP"]   # standard-processing archive, 375 m
  min_confidence: "nominal"                      # low | nominal | high  (drops "low")
  min_frp_mw: 0.0                                # keep FRP strictly above this
  drop_persistent_sources: true                  # crude filter for flares, plants, solar, volcanoes
  persistent_cell_deg: 0.005
  persistent_min_days: 8

imagery:
  stac_url: "https://earth-search.aws.element84.com/v1"   # public COGs of Copernicus Sentinel-2 L2A
  collection: "sentinel-2-l2a"
  max_scene_cloud: 40            # percent, from STAC metadata
  max_time_gap_hours: 6          # |FIRMS time - Sentinel-2 time|
  bands: ["B02", "B03", "B04", "B08", "B11", "B12"]
  resolution_m: 10               # SWIR bands (20 m native) are upsampled to this grid, nearest-neighbour
  patch_size: 128                # pixels, so 1.28 km on a side
  max_patch_cloud_frac: 0.4      # from the scene classification layer (SCL)
  max_nodata_frac: 0.05
  max_water_frac: 0.5

sampling:
  max_positives: 1500
  max_positives_per_scene: 30
  negatives_per_positive: 2
  neg_min_dist_m: 3000           # negatives are drawn this far from their anchor positive...
  neg_max_dist_m: 20000
  neg_exclusion_m: 2000          # ...and this far from ANY FIRMS detection (any confidence, +/- 1 day)
  min_sample_spacing_m: 1500     # no two patches in one scene closer than this
  neg_attempts: 25
  seed: 42

split:
  strategy: spatial_block        # spatial_block | temporal
  block_size_km: 25
  fractions: {train: 0.70, val: 0.15, test: 0.15}
  buffer_m: 3000                 # cross-split patches closer than this are purged (train/val side)
  temporal:
    val_start: "2024-09-01"
    test_start: "2024-10-01"
    buffer_days: 3

matching:                        # land-cover-matched negatives (see configs/matched.yaml)
  enabled: false
  negatives_per_positive: 2
  caliper_sd: 0.75

preprocess:
  indices: ["ndvi", "nbr"]       # options: ndvi, nbr, ndmi

baselines:
  classical_model: random_forest # random_forest | gradient_boosting | logistic
  ratio_grid: [1.0, 1.1, 1.2, 1.3, 1.5, 1.8, 2.2]

model:
  arch: resnet18                 # resnet18 | small_cnn
  stem: standard                 # standard | fine (fine = 3x3 stride-1 stem, ~4x slower on CPU)
  pretrained: false
  dropout: 0.2

train:
  epochs: 5
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  loss: bce                      # bce (pos_weight from train) | focal
  focal_gamma: 2.0
  patience: 5
  num_workers: 0
  num_threads: 0                 # 0 = torch default
  seed: 42

evaluate:
  n_error_examples: 8
  n_boot: 1000                            # bootstrap resamples for confidence intervals
  assumed_prevalences: [0.5, 0.1, 0.01]   # for prevalence-adjusted precision (illustrative only)

demo:
  checkpoint: demo_assets/model.pt