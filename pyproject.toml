[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-hotspot-detector"
version = "0.1.0"
description = "Active-fire hotspot detection from Sentinel-2 using NASA FIRMS weak labels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3.9",
  "xarray>=2024.1",
  "rioxarray>=0.15",
  "pyarrow>=14",
  "pystac-client>=0.8",
  "requests>=2.31",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "folium>=0.15",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "joblib>=1.3",
  "tqdm>=4.66",
  "tabulate>=0.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
deep = ["torch>=2.2", "torchvision>=0.17"]
demo = ["streamlit>=1.32", "torch>=2.2", "torchvision>=0.17"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]